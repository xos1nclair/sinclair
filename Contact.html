<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinclair - Contact</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="Home.html">Sinclair</a>
            <ul>
                <li><a href="Home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="FAQs.html">FAQs</a></li>
                <li><a href="Contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact">
            <span class="eyebrow">Send a note</span>
            <h1>Contact Sinclair</h1>
            <p>Have a fashion topic, collaboration idea, or runway moment you want featured? Send it here.</p>

            <form action="#" method="post">
                <label for="name"><span><i class="bx bxs-user-circle"></i>Name</span>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </label>

                <label for="email"><span><i class="bx bxs-envelope"></i>Email</span>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </label>

                <label for="message"><span><i class="bx bxs-book-content"></i>Message</span>
                    <textarea id="message" name="message" placeholder="Tell me what you have in mind..." required></textarea>
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sinclair. All Rights Reserved.</p>
    </footer>
</body>
</html>
